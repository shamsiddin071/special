<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
:root{--bg:#0f141b;--ink:#d4dae2;--mute:#7f8b9b;--line:#2a3441;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--bg:#0f141b;--ink:#d4dae2;--mute:#7f8b9b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#18212c 0%,var(--bg) 70%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.25rem;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0 28px;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#text{max-width:30rem;text-align:center;font-size:clamp(1.55rem,4.6vw,2.2rem);line-height:1.5;font-style:italic;transition:opacity .7s ease;opacity:0}
#text.on{opacity:1}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:0 28px;text-align:center;background:transparent;z-index:3;transition:opacity 1.2s ease}
#start.gone{opacity:0;pointer-events:none}
#start p{margin:0;max-width:26rem;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.4;font-style:italic}
button{font:inherit;font-size:1.1rem;color:var(--ink);background:none;border:1px solid var(--mute);border-radius:2px;padding:.55rem 1.3rem;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#bar{position:fixed;left:0;bottom:0;height:2px;width:0;background:var(--mute);transition:width .6s ease;z-index:2}
#foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column;align-items:center;gap:.9rem;z-index:2;opacity:0;transition:opacity 1.4s ease}
#foot.on{opacity:1}
#hint{color:var(--mute);font-size:1rem;margin:0}
#full{position:fixed;inset:0;background:var(--bg);z-index:5;overflow-y:auto;display:none;-webkit-user-select:text;user-select:text}
#full.on{display:block}
#full .in{max-width:34rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 26px 80px}
#full p{font-size:1.3rem;line-height:1.7;margin:0 0 1.6rem}
#full button{margin-top:1rem}
@media (prefers-reduced-motion:reduce){#text,#start,#foot,#bar{transition:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="start">
  <p>I’m very sad to be saying goodbye to you.</p>
  <button id="begin">Read my letter</button>
</div>
<div id="stage" aria-live="polite"><div id="text"></div></div>
<div id="foot">
  <p id="hint">If it moves too fast, touch the words and drag to the right to go back.</p>
  <button id="fullBtn">Read the full letter</button>
  <button id="soundBtn" style="display:none">Sound: on</button>
</div>
<div id="bar"></div>
<div id="full" role="dialog" aria-label="Full letter"><div class="in" id="fullIn"></div></div>

<script>
var P=[
["In our last conversation you told me you understood me, and I’m thankful for that.","The personal problems I mentioned are connected to a difficult situation in our family.","It isn’t over yet, and it weighs on me a lot.","I thought about it for a long time, and I realized that right now I need to dedicate myself to my family and my studies."],
["I’m the kind of person who doesn’t like showing others what’s going on inside me.","I’m always smiling, joking around, and I only post happy moments on Instagram.","But there is always something heavy inside me.","Even now, anyone looking at me wouldn’t guess I’m going through this."],
["I spent many days writing this letter.","Every day I thought about it, a line at a time, looking into your eyes, being happy together, and then continuing this letter when I got home."],
["You have been very precious to me{n}.","I loved your eyes, the way you cared about me, and the way you worried about me.","I believe you can be the best partner in someone’s life."],
["It isn’t easy for me to write this, and I wouldn’t have wanted to stop.","But the current situation is forcing me to.","The decision is final.","You are an amazing girl, and I will always remember you with warmth.","I wish you luck and happiness{n}."]
];
/* ===== NAME SLOT: type her name between the quotes ===== */
var NAME="EZOZA";
/* ======================================================= */
var SUF=NAME?", "+NAME:"";
P=P.map(function(p){return p.map(function(s){return s.replace("{n}",SUF)})});
var L=[];P.forEach(function(p){p.forEach(function(s){L.push(s)})});
var $=function(i){return document.getElementById(i)};
var i=0,started=false,paused=false,timer=null,swap=null,overlay=false;
var T=$("text");

function dur(s){return 2000+s.split(" ").length*340}
function show(n,quick){
  i=Math.max(0,Math.min(L.length-1,n));
  clearTimeout(swap);
  var put=function(){T.textContent=L[i];T.classList.add("on");$("bar").style.width=((i+1)/L.length*100)+"%"};
  T.classList.remove("on");
  if(quick){put()}else{swap=setTimeout(put,650)}
  schedule();
}
function schedule(){
  clearTimeout(timer);
  if(!started||paused||overlay||i>=L.length-1)return;
  timer=setTimeout(function(){show(i+1,false)},dur(L[i])+650);
}

/* ===== MUSIC SLOT: put your audio between the quotes below ===== */
var MUSIC_SRC="floating.m4a";
/* ================================================================ */
var audio=null;
if(MUSIC_SRC){audio=new Audio(MUSIC_SRC);audio.loop=true;audio.volume=.45;$("soundBtn").style.display=""}
$("soundBtn").onclick=function(){if(!audio)return;if(audio.paused){audio.play();this.textContent="Sound: on"}else{audio.pause();this.textContent="Sound: off"}};
$("begin").onclick=function(){
  if(audio){audio.play().catch(function(){$("soundBtn").textContent="Sound: off"})}
  $("start").classList.add("gone");
  setTimeout(function(){started=true;show(0,false);$("foot").classList.add("on");
    setTimeout(function(){$("hint").style.opacity=0;$("hint").style.transition="opacity 2s"},9000)},1100);
};

/* drag to go back / forward */
var sx=0,dragging=false;
$("stage").addEventListener("pointerdown",function(e){if(!started)return;dragging=true;paused=true;sx=e.clientX;clearTimeout(timer)});
window.addEventListener("pointermove",function(e){
  if(!dragging)return;
  var dx=e.clientX-sx;
  if(dx>50){show(i-1,true);sx=e.clientX}
  else if(dx<-50){show(i+1,true);sx=e.clientX}
});
function release(){if(!dragging)return;dragging=false;paused=false;schedule()}
window.addEventListener("pointerup",release);
window.addEventListener("pointercancel",release);
window.addEventListener("keydown",function(e){
  if(!started||overlay)return;
  if(e.key==="ArrowLeft")show(i-1,true);
  if(e.key==="ArrowRight")show(i+1,true);
});
document.addEventListener("visibilitychange",function(){if(document.hidden){clearTimeout(timer)}else{schedule()}});

/* full letter */
var fi=$("fullIn");
P.forEach(function(p){var el=document.createElement("p");el.textContent=p.join(" ");fi.appendChild(el)});
var back=document.createElement("button");back.textContent="Back to reading";fi.appendChild(back);
$("fullBtn").onclick=function(){overlay=true;clearTimeout(timer);$("full").classList.add("on");$("full").scrollTop=0};
back.onclick=function(){overlay=false;$("full").classList.remove("on");schedule()};

/* quiet rain */
(function(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var c=$("rain"),x=c.getContext("2d"),w,h,d=[],n=70;
  function size(){w=c.width=innerWidth;h=c.height=innerHeight}
  size();addEventListener("resize",size);
  for(var k=0;k<n;k++)d.push({x:Math.random()*w,y:Math.random()*h,l:10+Math.random()*16,v:1.2+Math.random()*1.6,a:.05+Math.random()*.1});
  function tick(){
    x.clearRect(0,0,w,h);x.lineWidth=1;
    d.forEach(function(r){
      x.strokeStyle="rgba(150,175,205,"+r.a+")";
      x.beginPath();x.moveTo(r.x,r.y);x.lineTo(r.x-1.5,r.y+r.l);x.stroke();
      r.y+=r.v;if(r.y>h){r.y=-r.l;r.x=Math.random()*w}
    });
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
